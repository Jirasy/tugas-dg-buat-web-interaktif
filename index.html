<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Rakit PC Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Simulasi Rakit PC</h1>
        <p>Pilih komponen terbaik dan rakit PC impianmu!</p>
    </header>

    <main class="container">
        <!-- Bagian Preview Visual -->
        <section class="preview-section">
            <div class="image-container">
                <!-- Foto diubah ke foto.jpeg tanpa elemen span penutup yang menghalangi -->
                <img src="foto.jpeg" alt="Ilustrasi Rakit PC" id="pc-preview-img">
            </div>
            <div id="canvas-container"></div>
        </section>

        <!-- Bagian Pemilihan Komponen -->
        <section class="components-section">
            <h2>Pilih Komponen</h2>
            
            <div class="component-group">
                <label for="processor">Processor (CPU):</label>
                <select id="processor" class="part-select">
                    <option value="0">-- Pilih CPU --</option>
                    <option value="1500000">Intel Core i3 / Ryzen 3</option>
                    <option value="2800000">Intel Core i5 / Ryzen 5</option>
                    <option value="4500000">Intel Core i7 / Ryzen 7</option>
                </select>
            </div>

            <div class="component-group">
                <label for="gpu">Kartu Grafis (GPU):</label>
                <select id="gpu" class="part-select">
                    <option value="0">-- Pilih GPU --</option>
                    <option value="2000000">GTX 1650</option>
                    <option value="4500000">RTX 3060</option>
                    <option value="8000000">RTX 4070</option>
                </select>
            </div>

            <div class="component-group">
                <label for="ram">RAM:</label>
                <select id="ram" class="part-select">
                    <option value="0">-- Pilih RAM --</option>
                    <option value="600000">8GB DDR4</option>
                    <option value="1100000">16GB DDR4</option>
                    <option value="2200000">32GB DDR5</option>
                </select>
            </div>

            <div class="summary-box">
                <h3>Total Estimasi Harga</h3>
                <p id="total-price">Rp 0</p>
                <button id="btn-reset" class="btn">Reset Rakitan</button>
            </div>
        </section>
    </main>

    <!-- Skrip Eksternal -->
    <script src="pc3d.js"></script>
    <script src="script.js"></script>
</body>
</html>
